# ─── FORMULAS ────────────────────────────────────────────────────────────────

formulas:
  - name: damage_formula
    status: active
    source: design/gdd/salud-daño.md
    referenced_by:
      - design/gdd/salud-daño.md
      - design/gdd/base-datos-demonios.md
      - design/gdd/combate-tiempo-real.md
    expression: "round(daño_base × (1 + mod_atacante) × (1 + resistencia_defensiva))"
    variables:
      - daño_base      # daño del ataque antes de modificadores
      - mod_atacante   # suma de modificadores demoníacos del atacante (puede ser 0)
      - resistencia_defensiva  # delta ∈ [-0.5, +0.5]; negativo = armor, positivo = vulnerabilidad
    output_range: [1, 999]  # mínimo 1 (edge case E1 en combate-tiempo-real.md)
    notes: "resistencia_defensiva usa notación delta (no multiplicador directo). Convención: negativo=reduce daño, positivo=amplifica daño."
    added: "2026-05-24"
    revised: "2026-05-26"

  - name: mod_atacante_formula
    status: active
    source: design/gdd/combate-tiempo-real.md
    referenced_by:
      - design/gdd/combate-tiempo-real.md
      - design/gdd/base-datos-demonios.md
    expression: "(∑ demon_modifier_i) × synergy_multiplier"
    variables:
      - demon_modifier_i    # modificador del i-ésimo demonio equipado (ej: Fuego=0.20, Arcano=0.25)
      - synergy_multiplier  # multiplicador de sinergia activa (sin sinergia=1.00)
    output_range: [0.0, 5.0]  # estimado; tunable
    notes: "Arcano se suma al pool de demon_modifier_i como cualquier otro demonio. No se aplica aparte."
    added: "2026-05-26"
    revised: ""

  - name: knockback_decay_formula
    status: active
    source: design/gdd/combate-tiempo-real.md
    referenced_by:
      - design/gdd/combate-tiempo-real.md
    expression: "knockback_velocity_initial × (1.0 - (elapsed_time / IFRAME_DURATION))"
    variables:
      - knockback_velocity_initial  # Vector2 inicial del knockback
      - elapsed_time                # tiempo transcurrido desde HIT_STUN entry
      - IFRAME_DURATION             # 0.3s (ver constantes)
    output_range: [0.0, 200.0]  # px/s; decay lineal a 0 en IFRAME_DURATION
    notes: "Vector separado de velocity del CharacterBody2D. Se suma a velocity en _physics_process."
    added: "2026-05-26"
    revised: ""

